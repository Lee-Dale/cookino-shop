name: cookino-datenbanken

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cookino_shop}
      POSTGRES_USER: ${POSTGRES_USER:-cookino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cookino_dev_passwort}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cookino_backend

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-cookino_shop}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-cookino_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-cookino_mongo_dev_passwort}
    volumes:
      - mongo_data:/data/db
      - ./mongodb/init-mongo.js:/docker-entrypoint-initdb.d/01_init-mongo.js:ro
      - ./mongodb/seed-products.js:/docker-entrypoint-initdb.d/02_seed-products.js:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok" | grep 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - cookino_backend

  api:
      build:
        context: ../..
        dockerfile: Dockerfile

      restart: unless-stopped
      
      environment:
        - SECRET_KEY=${SECRET_KEY}
        - POSTGRES_HOST=postgres
        - POSTGRES_PORT=5432
        - POSTGRES_DB=${POSTGRES_DB}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - MONGO_HOST=mongo
        - MONGO_PORT=27017
        - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
        - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
        - MONGO_DATABASE=${MONGO_DATABASE}
      
      ports:
        - "8000:8000"
      
      networks:
        - cookino_backend
      
      depends_on:
        postgres:
          condition: service_healthy
        mongo:
          condition: service_healthy
      
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
        interval: 5s
        timeout: 5s
        retries: 10
        start_period: 15s
      


networks:
  cookino_backend:
    name: cookino_backend

volumes:
  postgres_data:
  mongo_data:


